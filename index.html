<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      class="rel"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Logo + Header -->
      <header class="header">
        <div class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <h1 class="heading">AI Image Generator</h1>
        </div>

        <button class="theme-toggle">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>

      <div class="main-content">
        <form action="#" class="prompt-form">
          <textarea
            class="prompt"
            placeholder="Describe your image..."
            required
            autofocus
          >
          </textarea>

          <div class="prompt-actions">
            <div class="select-wrapper" required>
              <select class="custom-select">
                <option value="" selected disabled>Select Model</option>
                <option
                  value="https://gen.pollinations.ai/image/your%20prompt%20here"
                >
                  Pollinations AI
                </option>
              </select>
            </div>

            <div class="select-wrapper" required>
              <select class="custom-select">
                <option value="" selected disabled>Image Count</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>

            <div class="select-wrapper" required>
              <select class="custom-select">
                <option value="" selected disabled>Aspect Ratio</option>
                <option value="1/1">1:1</option>
                <option value="16/9">16:9</option>
                <option value="9/16">9:16</option>
              </select>
            </div>
          </div>

          <button type="submit" class="generate-btn">Generate</button>
        </form>
      </div>
    </div>
  </body>
</html>
